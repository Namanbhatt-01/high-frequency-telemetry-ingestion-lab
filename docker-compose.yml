version: '3.8'

services:
  influxdb:
    image: influxdb:2.7-alpine
    container_name: lab5_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=cisco-ai-fabric
      - DOCKER_INFLUXDB_INIT_BUCKET=network_telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=supersecret-token-lab5-telemetry-2026
      - DOCKER_INFLUXDB_INIT_RETENTION=72h
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      telemetry_net:
        ipv4_address: 172.35.0.10

  telegraf:
    image: telegraf:1.28-alpine
    container_name: lab5_telegraf
    restart: unless-stopped
    ports:
      - "8094:8094/udp"
      - "8186:8186"
    volumes:
      - ./config/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      telemetry_net:
        ipv4_address: 172.35.0.20

  grafana:
    image: grafana/grafana:10.2.3
    container_name: lab5_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      telemetry_net:
        ipv4_address: 172.35.0.30

  streaming_telemetry_agent:
    build:
      context: ./telemetry_agent
      dockerfile: Dockerfile
    container_name: lab5_streaming_agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TELEGRAF_UDP_HOST=telegraf
      - TELEGRAF_UDP_PORT=8094
      - TELEGRAF_HTTP_URL=http://telegraf:8186/telemetry/push
      - STREAMING_CADENCE_MS=100
      - SWITCH_ID=leaf-switch-01.ai-fabric.net
    depends_on:
      - telegraf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks:
      telemetry_net:
        ipv4_address: 172.35.0.40

  traffic_generator:
    build:
      context: ./traffic_generator
      dockerfile: Dockerfile
    container_name: lab5_traffic_gen
    restart: unless-stopped
    environment:
      - AGENT_CONTROL_URL=http://streaming_telemetry_agent:8080
      - BURST_INTERVAL_SEC=15
      - BURST_MBPS=18500.0
      - BURST_DURATION_SEC=1.2
    depends_on:
      streaming_telemetry_agent:
        condition: service_healthy
    networks:
      telemetry_net:
        ipv4_address: 172.35.0.50

networks:
  telemetry_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.35.0.0/24
