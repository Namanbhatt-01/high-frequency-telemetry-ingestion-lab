[agent]
  interval = "100ms"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "100ms"
  flush_jitter = "0s"
  precision = "1ms"
  hostname = "cisco-nexus-streaming-node"
  omit_hostname = false

###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "supersecret-token-lab5-telemetry-2026"
  organization = "cisco-ai-fabric"
  bucket = "network_telemetry"
  timeout = "2s"

###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

# 1. High-Frequency UDP Socket Listener (Simulates Dial-Out JSON / gNMI Stream)
[[inputs.socket_listener]]
  service_address = "udp://:8094"
  data_format = "json"
  json_name_key = "sensor_path"
  tag_keys = [
    "switch_id",
    "interface_name",
    "queue_name",
    "traffic_class",
    "sensor_path"
  ]
  json_string_fields = ["status", "oper_status"]
  json_time_key = "timestamp_ms"
  json_time_format = "unix_ms"

# 2. High-Frequency HTTP Listener (Simulates RESTCONF / OpenConfig Dial-Out)
[[inputs.http_listener_v2]]
  service_address = ":8186"
  paths = ["/telemetry/push"]
  methods = ["POST"]
  data_format = "json"
  json_name_key = "sensor_path"
  tag_keys = [
    "switch_id",
    "interface_name",
    "queue_name",
    "traffic_class",
    "sensor_path"
  ]
  json_time_key = "timestamp_ms"
  json_time_format = "unix_ms"
